name: ${COMPOSE_PROJECT_NAME:-stupid-log-source}

x-app: &app
  build:
    context: .
    target: production
  image: stupid-log:1.0.1
  restart: unless-stopped
  env_file:
    - path: .env.production
      required: false
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: database
    DB_PORT: "5432"
    LOG_CHANNEL: stderr
    LOG_LEVEL: info
  volumes:
    - app-storage:/var/www/html/storage/app

services:
  app:
    <<: *app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: "5432"
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:list"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-storage:
  postgres-data:
